<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digital Library Management System | University Portal</title>

  <!-- Google Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Custom App Styles -->
  <link rel="stylesheet" href="/css/style.css">

  <!-- Chart.js for Aggregation Analytics -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>


  <!-- Primary Navigation Bar -->
  <nav class="navbar navbar-expand-lg navbar-dark navbar-custom sticky-top">
    <div class="container-fluid px-lg-4">
      <a class="navbar-brand d-flex align-items-center" href="#" onclick="App.navigateTo('catalog')">
        <span class="brand-badge me-2"><i class="fas fa-book-reader me-1"></i> DLMS</span>
        <span class="fw-bold d-none d-sm-inline">University Digital Library</span>
      </a>

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarContent">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0" id="roleNavTabs">
          <!-- Populated dynamically based on authenticated role -->
        </ul>

        <div class="d-flex align-items-center gap-3">
          <!-- Notification Bell -->
          <div class="dropdown" id="notificationDropdownContainer">
            <button class="btn btn-link text-white position-relative p-2" type="button" data-bs-toggle="dropdown" aria-expanded="false">
              <i class="fas fa-bell fs-5"></i>
              <span id="notifBadge" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger" style="display:none; font-size: 0.65rem;">
                0
              </span>
            </button>
            <ul class="dropdown-menu dropdown-menu-end shadow-lg" style="width: 300px; max-height: 400px; overflow-y: auto;" id="notifDropdownMenu">
              <li class="p-2 border-bottom d-flex justify-content-between align-items-center">
                <span class="fw-bold small">Notifications</span>
                <button class="btn btn-link btn-sm p-0 text-decoration-none small" onclick="App.markAllNotifsRead()">Mark All Read</button>
              </li>
              <div id="notifListDropdown">
                <li class="p-3 text-center text-muted small">No notifications</li>
              </div>
            </ul>
          </div>

          <!-- Guest Actions -->
          <div id="authActions" class="d-flex gap-2">
            <button class="btn btn-outline-light btn-sm px-3" onclick="App.openAuthModal('login')">
              <i class="fas fa-sign-in-alt me-1"></i> Sign In
            </button>
            <button class="btn btn-primary btn-sm px-3" onclick="App.openAuthModal('register')">
              <i class="fas fa-user-plus me-1"></i> Register
            </button>
          </div>

          <!-- User Profile Dropdown -->
          <div id="userProfileMenu" class="dropdown d-none">
            <button class="btn btn-dark dropdown-toggle d-flex align-items-center gap-2 py-1 px-3 rounded-pill border border-secondary" type="button" data-bs-toggle="dropdown">
              <i class="fas fa-user-circle fs-5 text-info"></i>
              <div class="text-start d-none d-md-block" style="line-height: 1.1;">
                <span id="userDisplayName" class="small fw-bold d-block text-truncate" style="max-width: 140px;">User</span>
                <span id="userRoleBadge" class="badge bg-primary" style="font-size: 0.65rem;">MEMBER</span>
              </div>
            </button>
            <ul class="dropdown-menu dropdown-menu-end shadow">
              <li><h6 class="dropdown-header">Account Options</h6></li>
              <li><a class="dropdown-item" href="#" onclick="App.navigateTo('catalog')"><i class="fas fa-book-open me-2 text-muted"></i>Book Catalog</a></li>
              <li><hr class="dropdown-divider"></li>
              <li><a class="dropdown-item text-danger" href="#" onclick="Auth.logout()"><i class="fas fa-sign-out-alt me-2"></i>Sign Out</a></li>
            </ul>
          </div>
        </div>
      </div>
    </div>
  </nav>

  <!-- Main View Router Container -->
  <main class="container-fluid px-lg-4 py-4 flex-grow-1" id="viewContainer">
    <!-- Rendered dynamically by active view controller -->
  </main>

  <!-- Global Modal for Details / Actions -->
  <div class="modal fade" id="genericModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title fw-bold" id="genericModalTitle">Library Dialog</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body" id="genericModalBody">
          <!-- Reusable Body Content -->
        </div>
      </div>
    </div>
  </div>

  <!-- Authentication Modal (Login / Signup) -->
  <div class="modal fade" id="authModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header border-0 pb-0">
          <ul class="nav nav-tabs border-0 w-100" id="authTabs" role="tablist">
            <li class="nav-item flex-fill text-center" role="presentation">
              <button class="nav-link active fw-bold w-100" id="login-tab" data-bs-toggle="tab" data-bs-target="#login-pane" type="button">Sign In</button>
            </li>
            <li class="nav-item flex-fill text-center" role="presentation">
              <button class="nav-link fw-bold w-100" id="register-tab" data-bs-toggle="tab" data-bs-target="#register-pane" type="button">Member Register</button>
            </li>
          </ul>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body pt-4">
          <div class="tab-content" id="authTabsContent">
            <!-- Login Form -->
            <div class="tab-pane fade show active" id="login-pane">
              <form id="modalLoginForm">
                <div class="mb-3">
                  <label class="form-label small fw-bold">Email Address</label>
                  <input type="email" class="form-control" id="loginEmail" required>
                </div>
                <div class="mb-3">
                  <label class="form-label small fw-bold">Password</label>
                  <input type="password" class="form-control" id="loginPassword" required>
                </div>
                <div class="d-grid mt-4">
                  <button type="submit" class="btn btn-primary"><i class="fas fa-sign-in-alt me-1"></i> Sign In to Account</button>
                </div>
              </form>
            </div>

            <!-- Register Form -->
            <div class="tab-pane fade" id="register-pane">
              <form id="modalRegisterForm">
                <div class="mb-2">
                  <label class="form-label small fw-bold">Full Name</label>
                  <input type="text" class="form-control form-control-sm" id="regName" required>
                </div>
                <div class="mb-2">
                  <label class="form-label small fw-bold">University Email</label>
                  <input type="email" class="form-control form-control-sm" id="regEmail" required>
                </div>
                <div class="mb-2">
                  <label class="form-label small fw-bold">Password (min 6 characters)</label>
                  <input type="password" class="form-control form-control-sm" id="regPassword" minlength="6" required>
                </div>
                <div class="mb-2">
                  <label class="form-label small fw-bold">Member Type</label>
                  <select class="form-select form-select-sm" id="regMemberType">
                    <option value="STUDENT" selected>Student (Standard 14 Days)</option>
                    <option value="FACULTY">Faculty (Extended 30 Days)</option>
                  </select>
                </div>
                <div class="mb-3">
                  <label class="form-label small fw-bold">Phone Number</label>
                  <input type="text" class="form-control form-control-sm" id="regPhone">
                </div>
                <div class="d-grid">
                  <button type="submit" class="btn btn-success"><i class="fas fa-user-plus me-1"></i> Create Member Account</button>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Toast Notification Container -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- Application Footer -->
  <footer>
    <div class="container-fluid px-lg-4 d-flex flex-wrap justify-content-between align-items-center">
      <div class="small mb-2 mb-md-0">
        <strong>Digital Library Management System (P05)</strong> &copy; 2026 University Education System.
      </div>
      <div class="small d-flex gap-3">
        <a href="/api/health" target="_blank" class="text-info text-decoration-none"><i class="fas fa-heartbeat me-1"></i> API Health</a>
        <span class="text-secondary">|</span>
        <span class="text-light">Backend: Node.js & Express</span>
        <span class="text-secondary">|</span>
        <span class="text-light">Database: MongoDB Mongoose</span>
      </div>
    </div>
  </footer>

  <!-- Bootstrap 5 Bundle JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Application Scripts -->
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/catalog.js"></script>
  <script src="/js/memberView.js"></script>
  <script src="/js/librarianView.js"></script>
  <script src="/js/adminView.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
